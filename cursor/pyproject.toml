[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "ruff==0.15.12",
    "ty==0.0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
app = "app.presentation.cli:cli"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "W191",
    "E111",
    "E114",
    "E117",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "D",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201"]

[tool.ty.analysis]
replace-imports-with-any = [
    "aiobotocore.**",
    "botocore.**",
]

[tool.ty.terminal]
error-on-warning = true
